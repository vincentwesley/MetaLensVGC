name: Refresh data

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run data

      - run: npm test

      - name: Commit data if changed
        run: |
          git config user.name 'vgcmetascope-bot'
          git config user.email 'vgcmetascope-bot@users.noreply.github.com'
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m 'chore: refresh data'
            git push
          fi
