version: 2
# Monthly + grouped keeps PR noise low; GitHub security updates are separate and still arrive immediately.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # The app runs the vendored public/vendor/echarts.min.js (v5); a major move is a manual swap + visual check.
      - dependency-name: "echarts"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
